# Release config for app/app.py -- MASTER_PLAN.md Part 12.1.
# This is a RECORD of the exact config the deployed checkpoint was trained
# with (copied from results/finetune_app_converged_p2_class_balanced_seed42.json's
# "config" field, not hand-retyped), plus provenance fields the training
# script doesn't itself write into a standalone file. app/app.py does NOT
# read this file at runtime -- it reads the equivalent config dict straight
# out of the checkpoint (best_model.pt's own "config" key), which is the
# actual source of truth. This file exists for human/reviewer reference,
# per MASTER_PLAN.md Part 12.1's release-bundle layout.
#
# SUPERSEDES the original finetune_app_p2_seed42 checkpoint (15 epochs,
# test_qwk 0.613, "undertrained" band) with the converged retrain (40
# epochs, early-stop patience 8, test_qwk 0.716, "correct -- proceed"
# band) -- see app/release/MODEL_CARD.md for the full before/after.

checkpoint_source: checkpoints/finetune_app_converged_p2_class_balanced_seed42/best.pt
training_script: src/train/finetune_converged.py
training_config_file: configs/finetune_app_converged.yaml
result_file: results/finetune_app_converged_p2_class_balanced_seed42.json

model: tf_efficientnet_b0
image_size: 384
split: p2
seed: 42
sampler: class_balanced
best_epoch: 32
best_val_qwk: 0.7331276644121583
test_qwk: 0.7159509675171527
referable_dr_auroc: 0.9117124008736891
n_train: 27123
n_val: 5843
n_test: 5814

acceptance_test_10_1_verdict: "correct -- proceed (test_qwk 0.716 is in the 0.70-0.85 band, per src/train/finetune_converged.py's own verdict logic and the training run's own printed output)"
calibration_status: "CALIBRATED (Phase 7) -- src/experiments/calibrate.py fitted temperature scaling, a referral threshold (>=90% sensitivity on validation) and an uncertainty-gate tau on the P2 validation fold; results in results/calibration_reject.json, applied thresholds in app/release/thresholds.json (acceptance_test_11_1_verdict: pass). app/core/decision.py applies these at inference; if the checkpoint hash or verdict don't check out at startup the app falls back to raw uncalibrated confidence and says so on screen (never silently)."
acceptance_test_12_1_status: "re-run: 18/100 -> 8/100 on the same 100 images (see app/release/MODEL_CARD.md's Acceptance Test 12.1 section for the apples-to-apples verification)."
gradcam_status: "IMPLEMENTED (Phase 2) -- app/app.py's compute_gradcam_overlay() runs Grad-CAM on the backbone's conv_head for the predicted class. Requires `pip install grad-cam`; fails gracefully (panel blank, grading unaffected) if unavailable or version-mismatched -- not verified against every pytorch-grad-cam version."
known_preprocessing_bug_fixed: "EXIF orientation handling added to to_model_input() (ImageOps.exif_transpose(), matching cv2.imread()'s auto-rotation used when the training/eval cache was built) -- worth keeping for real EXIF-rotated uploads, but INVESTIGATED AND RULED OUT as the cause of Acceptance Test 12.1's ~18% grade-mismatch rate on the PRIOR (0.613, undertrained) checkpoint: 0/18 flipped images carried a non-default EXIF tag, and pixel MAE between the two pipelines' processed images was only 0.8-1.2/255 (ordinary JPEG-decoder noise, not a different crop). Conclusion at the time: NOT a preprocessing bug -- the prior checkpoint's narrow decision margin (undertrained) was flipping borderline cases on sub-1/255 noise. This checkpoint is the converged retrain done specifically to fix that; see acceptance_test_12_1_status above and MODEL_CARD.md's 'What Acceptance Test 12.1 found, before and after the retrain' section for the confirmed re-run result."
